; Замена /etc/neko/supervisord/brave.conf из образа ghcr.io/m1k1o/neko/brave.
; Так Neko принимает флаги браузера: supervisord читает все *.conf из этого каталога,
; поэтому свой файл кладётся поверх родного (см. docker-compose.yml, volumes).
; Сами флаги — в brave-start.sh: в .conf их неудобно комментировать.
[program:brave]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/etc/neko/brave-start.sh
stopsignal=INT
stopwaitsecs=15
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/brave.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

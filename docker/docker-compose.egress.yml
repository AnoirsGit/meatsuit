# Выход через домашний узел Tailscale (exit node). Необязательно. Подключается поверх основного файла:
#
#   MEATSUIT_EGRESS=tailscale в файле деплоя, затем docker/up.sh
#   (то же руками: docker compose --env-file <файл> -f docker-compose.yml -f docker-compose.egress.yml --profile egress up -d)
#
# Neko и life живут в сетевом окружении контейнера tailscale: весь их трафик, включая UDP и WebRTC,
# идёт через туннель, а правило из egress/killswitch.sh не даёт им выйти мимо него. Порты зеркала
# публикуются у tailscale (у контейнера в чужой сети своих портов быть не может).
#
# Нужны в файле деплоя: TS_AUTHKEY (одноразовый ключ), TS_EXTRA_ARGS=--exit-node=<имя домашнего узла>
# --exit-node-allow-lan-access=false. Подробности и порядок проверки: README.md и ../docs/egress.md.
# Имя хоста у браузера здесь — имя контейнера tailscale (TS_HOSTNAME): своё задать в чужой сети нельзя,
# и оно так же постоянное. Вызывающие подключаются так же: network_mode: "container:meatsuit-browser".
#
# НЕ ПРОВЕРЕНО: запускалось только описание (docker compose config); работа на сервере не проверена.

services:
  tailscale:
    ports:
      - ${NEKO_BIND_IP:-127.0.0.1}:${NEKO_PORT:-8080}:8080
      - ${NEKO_BIND_IP:-127.0.0.1}:59000-59019:59000-59019/udp
      - ${NEKO_BIND_IP:-127.0.0.1}:${MEATSUIT_API_PORT:-8787}:8787

  neko:
    network_mode: "service:tailscale"
    hostname: !reset null
    ports: !reset []
    dns: !reset []
    depends_on:
      tailscale:
        condition: service_healthy

  # Прогрев и HTTP-сервис в том же сетевом окружении, что Tailscale и Neko: их трафик тоже идёт через туннель
  # и под тем же выключателем. Без этих строк они остались бы в сети neko (цепочка life -> neko -> tailscale).
  life:
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

  server:
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy

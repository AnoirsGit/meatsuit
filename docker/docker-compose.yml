# meatsuit: зеркало браузера (Neko) с портом CDP для библиотеки; профиль живёт в томе.
#
#   npm run init                  файл деплоя (docker/.env или MEATSUIT_CONFIG): 0600, случайные пароли
#   docker/up.sh                  поднять зеркало: docker compose --env-file <файл> … up -d
#   docker/up.sh ps | logs -f neko | stop | down      любая команда compose с тем же файлом
#
# Браузер выбирает MEATSUIT_BROWSER в файле деплоя: chrome (по умолчанию) или brave (browser-<имя>.yml).
# Профиль у каждого свой: Chrome — том meatsuit_profile, Brave — meatsuit_brave_profile; после смены браузера
# входить на сайты заново. Имена для вызывающих постоянные: контейнер meatsuit-browser (подключение —
# network_mode: "container:meatsuit-browser", CDP на 127.0.0.1:9222) и том meatsuit_profile (uid 1000), в нём
# папка state/ — общий dir вызывающих: connect({ dir: '<том>/state' }).
#
# Необязательно: выход через Tailscale (MEATSUIT_EGRESS=tailscale в файле: up.sh добавит docker-compose.egress.yml
# и профиль egress). Замороженные extras/: автопрогрев (профиль warmup) и HTTP-сервис (профиль api).
name: meatsuit

services:
  neko:
    extends:
      file: browser-${MEATSUIT_BROWSER:-chrome}.yml
      service: browser
    container_name: meatsuit-browser
    # Имя хоста постоянное: замок профиля Chromium помнит имя хоста, и после пересоздания контейнера с другим
    # именем браузер встречал бы окном «профиль занят другим компьютером».
    hostname: meatsuit-browser
    restart: unless-stopped
    depends_on:
      profile-init:
        condition: service_completed_successfully
    # Время на корректное завершение: браузер при SIGINT сбрасывает на диск cookie и входы. Docker по умолчанию
    # ждёт 10 с и убивает; тогда всё, что записано за последние секунды (свежий вход), пропадает.
    stop_grace_period: 30s
    shm_size: 2gb # Chromium без достаточного /dev/shm падает на тяжёлых страницах
    # Потолки: сорвавшийся браузер (утечка, бесконечный цикл на странице) будет убит ядром, а не повесит хост.
    # shm входит в память контейнера. Подкачка выключена: memswap_limit равен mem_limit.
    mem_limit: ${NEKO_MEM:-3g}
    memswap_limit: ${NEKO_MEM:-3g}
    cpus: ${NEKO_CPUS:-2}
    pids_limit: 1024
    environment:
      TZ: ${MEATSUIT_TZ:-UTC} # часовой пояс браузера должен совпадать с поясом страны выхода
      NEKO_DESKTOP_SCREEN: ${NEKO_SCREEN:-1280x720@30} # кодирование видео идёт на процессоре: на слабом сервере берите меньше
      # Neko 3: один пароль у участника, другой у админа (кто какой ввёл, тем и вошёл).
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_PASSWORD:?Задайте NEKO_PASSWORD (npm run init)}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:?Задайте NEKO_ADMIN_PASSWORD (npm run init)}
      # Кука входа по умолчанию «Secure»: по http://100.x.y.z (tailnet) браузер её не примет.
      # Канал шифрует сам Tailscale, поэтому Secure выключена.
      NEKO_SESSION_COOKIE_SECURE: "false"
      # Управление мышью и клавиатурой берётся неявно: навёл на видео и работаешь. Без этого его надо
      # просить кнопкой, а клавиатура в зеркале молчит (проверено: фокус не уходит в поле ввода).
      NEKO_SESSION_IMPLICIT_HOSTING: "true"
      # WebRTC: порты фиксированы (их и публикуем), адрес для клиента задаёт NEKO_WEBRTC_IP.
      NEKO_WEBRTC_EPR: 59000-59019
      NEKO_WEBRTC_NAT1TO1: ${NEKO_WEBRTC_IP:-127.0.0.1}
    ports:
      # Только на этом адресе хоста. На сервере без egress поставьте сюда tailnet-адрес хоста.
      # Порт CDP (9222) не публикуется никогда: он слушает только 127.0.0.1 контейнера.
      - ${NEKO_BIND_IP:-127.0.0.1}:${NEKO_PORT:-8080}:8080
      - ${NEKO_BIND_IP:-127.0.0.1}:59000-59019:59000-59019/udp
      - ${NEKO_BIND_IP:-127.0.0.1}:${MEATSUIT_API_PORT:-8787}:8787 # HTTP-сервис (профиль api); пока он не запущен, порт пуст
    healthcheck:
      # Отвечает и веб-часть Neko, и порт CDP браузера.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Одноразовый, без сети: отдаёт пользователю neko (uid 1000) корень папки профиля текущего браузера и том
  # meatsuit_profile с папкой state/ — там вызывающие держат общий dir (замок очереди, счётчики, журнал).
  # Том создаётся и при Brave или MEATSUIT_PROFILE_DIR: вызывающие подключают его как external всегда.
  profile-init:
    extends:
      file: browser-${MEATSUIT_BROWSER:-chrome}.yml
      service: profile-owner
    entrypoint: ["sh", "-c", "mkdir -p /meatsuit/state && chown 1000:1000 /profile /meatsuit /meatsuit/state"]
    volumes:
      - profile:/meatsuit
    network_mode: none
    restart: "no"

  # Заморожено (extras/): автопрогрев, node extras/life.js run. Сеть общая с Neko (и в egress-варианте с Tailscale):
  # тогда CDP браузера доступен как http://127.0.0.1:9222, а своего выхода наружу у life нет.
  life:
    profiles: ["warmup"]
    build:
      context: ..
      dockerfile: docker/life/Dockerfile
    restart: unless-stopped
    init: true # без этого Node как PID 1 не реагирует на SIGTERM
    network_mode: "service:neko"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: ${LIFE_CPUS:-0.5} # 0 — без ограничения (на некоторых хостингах квота процессора не принимается)
    pids_limit: 256
    depends_on:
      neko:
        condition: service_healthy
    environment:
      TZ: ${MEATSUIT_TZ:-UTC} # часовой пояс браузера должен совпадать с поясом страны выхода
      MEATSUIT_CDP: http://127.0.0.1:9222
    volumes:
      - ..:/app:ro # код из репозитория; зависимости (patchright) лежат в образе
      - life_data:/data # состояние, журнал data/life.jsonl, повадки persona.json
    command: ["node", "extras/life.js", "run", "--config", "${LIFE_CONFIG:-/app/profiles/life.json}", "--data", "/data"]

  # Заморожено (extras/): HTTP-сервис GET /view и POST /act (docs/http-api.md). Профиль api. Сеть общая с Neko
  # (в egress-варианте с Tailscale), поэтому CDP браузера это http://127.0.0.1:9222, а порт 8787 публикуется
  # у neko на NEKO_BIND_IP. Внутри общей сети сервис слушает все адреса, наружу его пускает только эта публикация.
  # Нужны в ../profiles: clients.json (токены, в git не лежит), sites.json, egress.json; без любого из них сервис не стартует.
  # Каталог /data тот же, что у life: в нём persona.json, чтобы руки были теми же.
  server:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: docker/life/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: "service:neko"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: ${SERVER_CPUS:-0.5}
    pids_limit: 256
    depends_on:
      neko:
        condition: service_healthy
    environment:
      TZ: ${MEATSUIT_TZ:-UTC}
      MEATSUIT_TZ: ${MEATSUIT_TZ:-UTC}
      MEATSUIT_CDP: http://127.0.0.1:9222
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ..:/app:ro
      - life_data:/data
    command: ["node", "extras/server.js", "--host", "0.0.0.0", "--port", "8787", "--data", "/data"]

  # Выход через Tailscale: необязательный профиль egress, только вместе с docker-compose.egress.yml
  # (docker/up.sh добавляет оба при MEATSUIT_EGRESS=tailscale).
  tailscale:
    profiles: ["egress"]
    image: tailscale/tailscale:${TS_TAG:-stable}
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-meatsuit}
    # Перед запуском Tailscale ставит аварийный выключатель, затем отдаёт управление containerboot.
    entrypoint: ["/bin/sh", "/killswitch.sh"]
    command: ["/usr/local/bin/containerboot"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # IPv6 в общей сети закрыт совсем: выход идёт по IPv4, а открытый IPv6 был бы дырой мимо туннеля.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      # С exit node маршрут по умолчанию в контейнере — туннель (таблица 52). Ответы на соединения самого tailscaled
      # (control, DERP — помечены 0x80000) строгий rp_filter без src_valid_mark выбрасывал: туннель не поднимался.
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.default.rp_filter: "2"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    # DNS браузера идёт обычным запросом через общий маршрут, то есть через туннель.
    dns: [1.1.1.1, 9.9.9.9]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-meatsuit}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false" # ядерный режим: настоящий интерфейс tailscale0, нужен для правила по владельцу
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./egress/killswitch.sh:/killswitch.sh:ro
    healthcheck:
      # Вошёл в tailnet И выбранный exit node в сети.
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\": \"Running\"' && tailscale status --json | awk '/\"ExitNodeStatus\"/{f=1} f&&/\"Online\"/{print;exit}' | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  # Профили браузеров с постоянными именами (не зависят от имени проекта): к ним подключаются вызывающие.
  profile:
    name: meatsuit_profile # Google Chrome
  brave_profile:
    name: meatsuit_brave_profile # Brave (имя совпадает с томом прежнего зеркала на Brave)
  life_data:
  tailscale_state:
